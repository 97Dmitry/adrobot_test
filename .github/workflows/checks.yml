name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.22"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check app tests migrations
      - run: uv run --frozen --extra dev ruff format --check app tests migrations
      - run: uv run --frozen --extra dev pytest -q
      - run: uv run --frozen --extra dev playwright install --with-deps chromium
      - run: uv run --frozen --extra dev pytest tests/browser -q
        env:
          RUN_BROWSER: "1"
